# Docker / container-friendly networking defaults for a Kamal host.

# Forwarding (required for Docker bridge networking)
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1

# Slightly more connection tracking headroom for many short-lived connections
net.netfilter.nf_conntrack_max = 262144

# Do not accept source routes
net.ipv4.conf.all.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0

# Ignore bogus ICMP
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
